name: CI

on:
  # No push trigger. There is no dev branch here, so it only ever fired on main, where a pull
  # request has already run this matrix with the change merged in. main is not protected, so
  # nothing enforces a green pull request either; dispatch this workflow to check main itself.
  pull_request:
    branches: [ main ]

  workflow_dispatch:

# A push to a pull request makes the run for its previous commit moot. Keyed by pull request
# number rather than by branch name, because two forks can use the same one and neither of
# those runs supersedes the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHP 8.3 and below and Laravel 11 are gone, and so is the Livewire 4 beta now that
        # ^4.0 is released and covers it. That takes the matrix from 22 legs to 4; composer.json
        # still permits the older versions without this workflow claiming to cover them.
        php: [ '8.4', '8.5' ]
        laravel: [ '12' ]
        livewire: [ '^3.0', '^4.0' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, xml, ctype, json, tokenizer

      - name: Get composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Prepare composer
        env:
          COMPOSER_MEMORY_LIMIT: -1
        run: |
          composer --version
          # Require matching Livewire and Illuminate versions but don't update yet
          composer require --no-update "livewire/livewire:${{ matrix.livewire }}"
          composer require --no-update "illuminate/support:${{ matrix.laravel }}.*" "illuminate/view:${{ matrix.laravel }}.*" "illuminate/console:${{ matrix.laravel }}.*"
          composer update --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Show installed package versions
        run: composer show | sed -n '1,200p'

      - name: Run Pint (format check)
        run: composer pint || true

      - name: Run PHPStan (Larastan)
        run: composer phpstan || true

      - name: Run tests
        run: composer test -- --colors=always
